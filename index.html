<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberZone Games - Tienda Gaming</title>
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Hoja de Estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header>
    <div class="logo" onclick="mostrarPaginaInicio()">CYBERZONE</div>
    <input type="text" id="search-input" class="search-box" placeholder="Buscar periféricos, consolas..." oninput="filtrarProductos()">
    <button class="cart-button" onclick="toggleCarrito()">🛒 Carrito (<span id="cart-count">0</span>)</button>
  </header>

  <!-- Vista Principal -->
  <div id="home-view" class="view active">
    <!-- Carrusel -->
    <div class="carousel-container">
      <div class="carousel-slide active" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200');">
        <div class="slide-content">
          <div class="slide-title">GEAR GAMING NEXT-GEN</div>
          <p>Equipa tu setup con la máxima tecnología RGB</p>
        </div>
      </div>
      <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200');">
        <div class="slide-content">
          <div class="slide-title">DESCUENTOS EN PERIFÉRICOS</div>
          <p>Hasta 30% de descuento en mandos y teclados mecánicos</p>
        </div>
      </div>
    </div>

    <!-- Contenido y Filtros -->
    <div class="main-container">
      <aside>
        <h3>Categorías</h3>
        <button class="cat-btn active" onclick="filtrarCategoria('Todas', this)">Todas</button>
        <button class="cat-btn" onclick="filtrarCategoria('Consolas', this)">Consolas</button>
        <button class="cat-btn" onclick="filtrarCategoria('Periféricos RGB', this)">Periféricos RGB</button>
        <button class="cat-btn" onclick="filtrarCategoria('Sillas & Setup', this)">Sillas & Setup</button>
        <button class="cat-btn" onclick="filtrarCategoria('Componentes', this)">Componentes</button>
      </aside>
      <main class="products-grid" id="products-container"></main>
    </div>
  </div>

  <!-- Vista Detalle de Producto -->
  <div id="product-detail-view" class="view">
    <div class="detail-container">
      <button class="btn-back" onclick="mostrarPaginaInicio()">← VOLVER AL CATÁLOGO</button>
      <div class="detail-grid">
        <div>
          <img id="detail-img" class="detail-img-main" src="" alt="">
          <!-- Selección de Diseños -->
          <div class="design-section">
            <div class="design-title">Diseño / Edición: <span id="selected-design-name" style="color:white;"></span></div>
            <div id="detail-designs" class="design-list"></div>
          </div>
        </div>
        <div>
          <h1 id="detail-title" style="font-family:'Orbitron'; color:var(--cyan); margin-bottom:10px;"></h1>
          <div id="detail-category" style="color:var(--magenta); margin-bottom:10px; font-weight:bold;"></div>
          <div id="detail-price" style="font-size:28px; font-weight:bold; color:white; margin-bottom:15px;"></div>
          <p id="detail-desc" style="line-height:1.6; margin-bottom:20px;"></p>
          <button id="detail-add-btn" class="checkout-btn">AGREGAR AL CARRITO</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Carrito Desplegable -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2 style="font-family:'Orbitron'; color:var(--cyan);">TU CARRITO</h2>
      <button class="close-btn" onclick="toggleCarrito()">✕</button>
    </div>
    <div class="cart-items" id="cart-items-container"></div>
    <div class="cart-footer">
      <h3>Total: $<span id="cart-total">0.00</span></h3>
      <button class="checkout-btn" onclick="vaciarCarrito()">FINALIZAR COMPRA</button>
    </div>
  </div>

  <!-- Código de JavaScript -->
  <script src="pagina de amazon.js"></script>
</body>
</html>
